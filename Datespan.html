<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Datespan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap">
<style>
  /* Layout: a single centered card; two date fields feed a large result number, with a thin horizon line of ticks representing the span beneath it */
  :root {
    --bg: #faf8f4;
    --surface: #ffffff;
    --ink: #1f2420;
    --ink-dim: #6b7268;
    --line: #dddad1;
    --accent: #3a6b52;
    --accent-soft: #e7efe9;
    --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'Space Mono', 'SF Mono', Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151815;
      --surface: #1c201c;
      --ink: #ece9e2;
      --ink-dim: #93988e;
      --line: #32372f;
      --accent: #7fba9b;
      --accent-soft: #233229;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151815;
    --surface: #1c201c;
    --ink: #ece9e2;
    --ink-dim: #93988e;
    --line: #32372f;
    --accent: #7fba9b;
    --accent-soft: #233229;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: clamp(32px, 7vw, 72px);
    min-height: 100%;
    display: flex;
    justify-content: center;
  }

  .page {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(2rem, 5vw, 2.6rem);
    margin: 0;
    text-wrap: balance;
    letter-spacing: -0.01em;
  }

  .sub {
    color: var(--ink-dim);
    font-size: 0.95rem;
    margin: 0;
    line-height: 1.5;
    max-width: 50ch;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: clamp(20px, 4vw, 32px);
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .fields {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 14px;
    align-items: end;
  }
  @media (max-width: 480px) {
    .fields { grid-template-columns: 1fr; }
    .arrow { display: none; }
  }

  .field { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .field label {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .field input[type="date"] {
    font-family: var(--font-body);
    font-size: 1rem;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 12px;
    width: 100%;
    min-width: 0;
  }
  .field input[type="date"]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .arrow {
    color: var(--ink-dim);
    font-size: 1.1rem;
    padding-bottom: 12px;
    font-family: var(--font-mono);
  }

  .divider { height: 1px; background: var(--line); border: none; margin: 0; }

  .result {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .result .label {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .result .big {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(3rem, 12vw, 5rem);
    line-height: 1;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }
  .result .unit {
    font-family: var(--font-body);
    font-size: 1.1rem;
    color: var(--ink-dim);
    font-weight: 500;
  }
  .result .direction {
    font-size: 0.9rem;
    color: var(--ink-dim);
    margin-top: 2px;
  }

  .breakdown {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  @media (max-width: 480px) {
    .breakdown { grid-template-columns: repeat(2, 1fr); }
  }
  .chip {
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 12px 10px;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .chip .n {
    font-family: var(--font-mono);
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .chip .u {
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  .horizon {
    position: relative;
    height: 48px;
  }
  .horizon svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .horizon .tick { stroke: var(--line); stroke-width: 1; }
  .horizon .tick-major { stroke: var(--ink-dim); stroke-width: 1.2; }
  .horizon .track { stroke: var(--accent); stroke-width: 2; }
  .horizon .dot { fill: var(--accent); }
  .horizon .dot-ring { fill: var(--bg); stroke: var(--accent); stroke-width: 2; }
  .horizon text { font-family: var(--font-mono); font-size: 9px; fill: var(--ink-dim); }

  .footnote {
    font-size: 0.82rem;
    color: var(--ink-dim);
    line-height: 1.5;
  }
  .footnote b { color: var(--ink); font-weight: 600; }

  .presets {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .preset-btn {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    border-radius: 999px;
    padding: 6px 12px;
    cursor: pointer;
  }
  .preset-btn:hover { border-color: var(--accent); color: var(--accent); }
  .preset-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (prefers-reduced-motion: no-preference) {
    .result .big { transition: opacity 0.15s ease; }
  }
</style>

<div class="page">
  <div>
    <div class="eyebrow">Date calculator</div>
    <h1>How far between two dates?</h1>
    <p class="sub">Pick a start and an end. Datespan counts the exact days between them and breaks the span into years, months and weeks.</p>
  </div>

  <div class="card">
    <div class="fields">
      <div class="field">
        <label for="start">Start</label>
        <input type="date" id="start" />
      </div>
      <div class="arrow">&rarr;</div>
      <div class="field">
        <label for="end">End</label>
        <input type="date" id="end" />
      </div>
    </div>

    <div class="presets">
      <button class="preset-btn" data-preset="today-nye">Today &rarr; New Year</button>
      <button class="preset-btn" data-preset="today-plus-100">Today &rarr; +100 days</button>
      <button class="preset-btn" data-preset="swap">Swap dates</button>
    </div>

    <hr class="divider" />

    <div class="result">
      <div class="label" id="result-label">Span</div>
      <div class="big" id="big-number">0</div>
      <div class="unit" id="big-unit">days</div>
      <div class="direction" id="direction-note"></div>
    </div>

    <div class="breakdown" id="breakdown"></div>

    <div class="horizon" id="horizon"></div>

    <div class="footnote" id="footnote"></div>
  </div>
</div>

<script>
(function () {
  var startInput = document.getElementById('start');
  var endInput = document.getElementById('end');
  var bigNumber = document.getElementById('big-number');
  var bigUnit = document.getElementById('big-unit');
  var resultLabel = document.getElementById('result-label');
  var directionNote = document.getElementById('direction-note');
  var breakdown = document.getElementById('breakdown');
  var footnote = document.getElementById('footnote');
  var horizon = document.getElementById('horizon');

  function toDate(str) {
    if (!str) return null;
    var parts = str.split('-');
    return new Date(Date.UTC(+parts[0], +parts[1] - 1, +parts[2]));
  }

  function fmt(d) {
    return d.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric', timeZone: 'UTC' });
  }

  function dayCount(a, b) {
    var MS = 86400000;
    return Math.round((b.getTime() - a.getTime()) / MS);
  }

  function ymwd(totalDays) {
    var days = totalDays;
    var years = Math.floor(days / 365.2425);
    var remAfterYears = days - Math.floor(years * 365.2425);
    var months = Math.floor(remAfterYears / 30.4369);
    var remAfterMonths = Math.round(remAfterYears - months * 30.4369);
    var weeks = Math.floor(remAfterMonths / 7);
    var remDays = remAfterMonths - weeks * 7;
    return { years: years, months: months, weeks: weeks, days: Math.max(remDays, 0) };
  }

  function setPresetDates(kind) {
    var today = new Date();
    var todayStr = today.toISOString().slice(0, 10);
    if (kind === 'today-nye') {
      startInput.value = todayStr;
      var nye = new Date(Date.UTC(today.getUTCFullYear(), 11, 31));
      if (toDate(todayStr) >= nye) nye = new Date(Date.UTC(today.getUTCFullYear() + 1, 11, 31));
      endInput.value = nye.toISOString().slice(0, 10);
    } else if (kind === 'today-plus-100') {
      startInput.value = todayStr;
      var plus = new Date(today.getTime() + 100 * 86400000);
      endInput.value = plus.toISOString().slice(0, 10);
    } else if (kind === 'swap') {
      var s = startInput.value, e = endInput.value;
      startInput.value = e;
      endInput.value = s;
    }
    render();
  }

  document.querySelectorAll('.preset-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      setPresetDates(btn.getAttribute('data-preset'));
    });
  });

  function drawHorizon(totalDays, forward) {
    var w = horizon.clientWidth || 560;
    var h = 48;
    var pad = 10;
    var usable = w - pad * 2;
    var tickCount = Math.min(Math.max(Math.round(usable / 26), 6), 28);
    var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">';
    svg += '<line x1="' + pad + '" y1="24" x2="' + (w - pad) + '" y2="24" class="track" stroke-linecap="round"/>';
    for (var i = 0; i <= tickCount; i++) {
      var x = pad + (usable * i) / tickCount;
      var major = (i % Math.ceil(tickCount / 6) === 0);
      var y1 = major ? 16 : 19;
      svg += '<line x1="' + x + '" y1="' + y1 + '" x2="' + x + '" y2="30" class="' + (major ? 'tick-major' : 'tick') + '"/>';
    }
    svg += '<circle cx="' + pad + '" cy="24" r="4" class="dot-ring"/>';
    svg += '<circle cx="' + (w - pad) + '" cy="24" r="5" class="dot"/>';
    svg += '</svg>';
    horizon.innerHTML = svg;
  }

  function render() {
    var sVal = startInput.value;
    var eVal = endInput.value;
    if (!sVal || !eVal) {
      bigNumber.textContent = '—';
      bigUnit.textContent = 'pick both dates';
      directionNote.textContent = '';
      breakdown.innerHTML = '';
      horizon.innerHTML = '';
      footnote.textContent = '';
      return;
    }

    var s = toDate(sVal);
    var e = toDate(eVal);
    var raw = dayCount(s, e);
    var abs = Math.abs(raw);

    resultLabel.textContent = raw === 0 ? 'Same day' : (raw > 0 ? 'Time between' : 'Time between');
    bigNumber.textContent = abs.toLocaleString();
    bigUnit.textContent = abs === 1 ? 'day' : 'days';

    if (raw > 0) {
      directionNote.textContent = fmt(e) + ' is ' + abs.toLocaleString() + ' day' + (abs === 1 ? '' : 's') + ' after ' + fmt(s) + '.';
    } else if (raw < 0) {
      directionNote.textContent = fmt(e) + ' is ' + abs.toLocaleString() + ' day' + (abs === 1 ? '' : 's') + ' before ' + fmt(s) + '.';
    } else {
      directionNote.textContent = fmt(s) + ' — the two dates are the same.';
    }

    var parts = ymwd(abs);
    var chips = [
      { n: parts.years, u: parts.years === 1 ? 'year' : 'years' },
      { n: parts.months, u: parts.months === 1 ? 'month' : 'months' },
      { n: parts.weeks, u: parts.weeks === 1 ? 'week' : 'weeks' },
      { n: parts.days, u: parts.days === 1 ? 'day' : 'days' }
    ];
    breakdown.innerHTML = chips.map(function (c) {
      return '<div class="chip"><div class="n">' + c.n + '</div><div class="u">' + c.u + '</div></div>';
    }).join('');

    drawHorizon(abs, raw >= 0);

    var weeksExact = (abs / 7).toFixed(1);
    footnote.innerHTML = 'That\'s also <b>' + weeksExact + ' weeks</b>, or roughly <b>' + (abs / 30.4369).toFixed(1) + ' months</b>, or <b>' + (abs / 365.2425).toFixed(2) + ' years</b>.';
  }

  startInput.addEventListener('input', render);
  endInput.addEventListener('input', render);
  window.addEventListener('resize', function () {
    if (startInput.value && endInput.value) render();
  });

  // Seed with a sensible example: today through end of this year
  var today = new Date();
  var todayStr = today.toISOString().slice(0, 10);
  startInput.value = todayStr;
  var nye = new Date(Date.UTC(today.getUTCFullYear(), 11, 31));
  endInput.value = nye.toISOString().slice(0, 10);

  render();
})();
</script>

</body></html>
